<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>장소 수정</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tripplanner/tokens.css">
<link rel="stylesheet" href="tp-icons.css">
</head>
<body>
<x-dc>
<helmet>
<style>*{font-family:var(--font-sans)}[data-theme]{font-weight:500}code{font-weight:500}
html,body{margin:0;overflow:hidden;scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:var(--primary)}a:hover{color:var(--on_primary_container)}
</style>
</helmet>
<div data-theme="light" style="position: relative; width: 390px; height: 860px; box-sizing: border-box; overflow: hidden; background: var(--background); color: var(--on_surface); font-family: var(--font-sans); display: flex; flex-direction: column;">
  <header style="display: flex; align-items: center; padding: 12px 4px 4px;">
    <a href="PlaceView.dc.html" aria-label="닫기" style="width: 48px; height: 48px; border-radius: 24px; color: var(--on_surface); display: grid; place-items: center;"><span class="ic i-close" aria-hidden="true"></span></a>
    <h1 style="margin: 0; flex-grow: 1; font-size: 18px; line-height: 24px; font-weight: 600;">장소 수정</h1>
  </header>

  <div style="position: relative; flex-grow: 1; min-height: 0;">
  <div style="position: relative; padding: 8px 16px 104px 16px; display: flex; flex-direction: column; gap: 12px;">
    <a href="AddPlaceSearch.dc.html" aria-label="장소 검색으로 이름·위치·운영 정보 채우기" style="text-decoration: none; flex: none; height: 48px; border: 1px solid var(--outline); border-radius: 12px; background: var(--card_bg); color: var(--primary); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600;"><span class="ic i-search s20" aria-hidden="true"></span>검색</a>

    <div style="flex: none; display: flex; gap: 12px; align-items: stretch;">
      <button aria-label="사진 고르기" style="width: 80px; flex: none; box-sizing: border-box; border: 1.5px dashed var(--outline); border-radius: 12px; background: transparent; color: var(--text_sub); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600;"><span class="ic i-add_photo" aria-hidden="true"></span>사진</button>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
        <label for="nm" style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text_sub); padding-left: 4px;">장소 이름 *</label>
        <input id="nm" value="츠지한 니혼바시" style="width: 100%; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 2px solid var(--primary); background: var(--card_bg); color: var(--on_surface); font-size: 16px; font-weight: 500;">
      </div>
    </div>

    <div style="flex: none; display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text_sub); padding-left: 4px;">종류</span>
      <a href="AddPlaceInfo.dc.html" aria-label="종류 도움말 보기" style="width: 32px; height: 32px; margin: -6px -4px -6px 0; border-radius: 16px; color: var(--text_sub); display: grid; place-items: center;"><span class="ic i-info s18" aria-hidden="true"></span></a>
    </div>
    <div role="radiogroup" aria-label="장소 종류" style="flex: none; display: flex; flex-wrap: wrap; gap: 8px; margin-top: -8px;">
      <span role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 8px; border-radius: 10px; background: var(--cat_sight_bg); color: var(--on_surface); font-size: 14px; font-weight: 600;"><span class="ic i-sight s18" aria-hidden="true"></span>관광</span>
      <span role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 8px; box-sizing: border-box; border-radius: 10px; border: 2px solid var(--on_surface); background: var(--cat_food_bg); color: var(--on_surface); font-size: 14px; font-weight: 700;"><span class="ic i-check s18" aria-hidden="true"></span>맛집</span>
      <span role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 8px; border-radius: 10px; background: var(--cat_cafe_bg); color: var(--on_surface); font-size: 14px; font-weight: 600;"><span class="ic i-cafe s18" aria-hidden="true"></span>카페</span>
      <span role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 8px; border-radius: 10px; background: var(--cat_shopping_bg); color: var(--on_surface); font-size: 14px; font-weight: 600;"><span class="ic i-shopping s18" aria-hidden="true"></span>쇼핑</span>
      <span role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 8px; border-radius: 10px; background: var(--cat_activity_bg); color: var(--on_surface); font-size: 14px; font-weight: 600;"><span class="ic i-activity s18" aria-hidden="true"></span>체험</span>
      <span role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 8px; border-radius: 10px; background: var(--surface_container); color: var(--on_surface); font-size: 14px; font-weight: 600;"><span class="ic i-place s18" aria-hidden="true"></span>기타</span>
      <span role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 8px; border-radius: 10px; background: var(--tertiary_container); color: var(--on_surface); font-size: 14px; font-weight: 600;"><span class="ic i-night s18" aria-hidden="true"></span>야경</span>    </div>

    <div style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <div style="height: 48px; padding: 4px; box-sizing: border-box; border-radius: 12px; background: var(--surface_container); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px;">
        <button style="border: 0; border-radius: 9px; background: transparent; color: var(--text_sub); font-size: 14px; font-weight: 600;">후보</button>
        <button aria-pressed="true" style="border: 0; border-radius: 9px; background: var(--card_bg); color: var(--on_surface); font-size: 14px; font-weight: 600;">확정</button>
      </div>
      <a href="AddPlaceDay.dc.html" aria-label="일차 고르기, 지금 1일차" style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid var(--outline); background: var(--card_bg); color: var(--on_surface); text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500;"><span class="ic i-event s20" aria-hidden="true" style="color: var(--text_sub);"></span><span style="flex-grow: 1; text-align: left;">1일차</span><span class="ic i-arrow_down s20" aria-hidden="true" style="color: var(--text_sub);"></span></a>
    </div>

    <div style="flex: none; display: flex; align-items: center; margin-top: 12px;">
      <h2 style="margin: 0; flex-grow: 1; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--text_sub);">운영 정보</h2>
      <button style="display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--primary); font-size: 12px; font-weight: 600;"><span class="ic i-sync s16" aria-hidden="true"></span>다시 가져오기</button>
    </div>
    <div style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <div style="display: flex; flex-direction: column; gap: 4px;"><label for="hr" style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text_sub); padding-left: 4px;">운영시간</label><input id="hr" value="11:00 ~ 21:00" style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid var(--outline); background: var(--card_bg); color: var(--on_surface); font-size: 16px; font-weight: 500;"></div>
      <div style="display: flex; flex-direction: column; gap: 4px;"><label for="br" style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text_sub); padding-left: 4px;">브레이크 타임</label><input id="br" value="15:00 ~ 17:00" style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid var(--outline); background: var(--card_bg); color: var(--on_surface); font-size: 16px; font-weight: 500;"></div>
      <div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px;"><label for="cl" style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text_sub); padding-left: 4px;">휴무일</label><input id="cl" value="없음" style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid var(--outline); background: var(--card_bg); color: var(--on_surface); font-size: 16px; font-weight: 500;"></div>
    </div>
    <div style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;"><label for="la" style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text_sub); padding-left: 4px;">위도</label><input id="la" value="35.6830" inputmode="decimal" style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid var(--outline); background: var(--card_bg); color: var(--on_surface); font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; width: 100%;"></div>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;"><label for="lo" style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text_sub); padding-left: 4px;">경도</label><input id="lo" value="139.7745" inputmode="decimal" style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid var(--outline); background: var(--card_bg); color: var(--on_surface); font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; width: 100%;"></div>
    </div>
    <div style="flex: none; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 12px; border-radius: 12px; background: var(--card_bg); border: 1px solid var(--outline_variant);">
      <span style="flex-grow: 1; font-size: 16px; font-weight: 500;">예약 필수</span>
      <span role="switch" aria-checked="true" aria-label="예약 필수" style="width: 52px; height: 32px; box-sizing: border-box; border-radius: 16px; background: var(--primary); display: flex; align-items: center; justify-content: flex-end; padding: 0 4px;"><span style="width: 24px; height: 24px; border-radius: 12px; background: var(--on_primary); display: grid; place-items: center; color: var(--primary);"><span class="ic i-check s16" aria-hidden="true"></span></span></span>
    </div>

  </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 12px 16px 20px; background: var(--card_bg); border-top: 1px solid var(--outline_variant);">
    <a href="PlaceView.dc.html" style="text-decoration: none; flex-grow: 1; height: 48px; border-radius: 999px; border: 1px solid var(--outline); background: transparent; color: var(--primary); font-size: 14px; font-weight: 600; display: grid; place-items: center;">취소</a>
    <a href="PlaceSaved.dc.html" style="text-decoration: none; flex-grow: 2; height: 48px; border: 0; border-radius: 999px; background: var(--primary); color: var(--on_primary); font-size: 14px; font-weight: 600; display: grid; place-items: center;">저장</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":860}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
