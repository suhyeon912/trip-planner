        <span style="flex-grow: 1; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums;">2026.11.20 (금) – 11.23 (월)</span>

    </div>

      <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text_sub); padding-left: 4px;">표지 사진 (선택)</span>

  </div>
