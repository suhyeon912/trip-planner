<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>새 여행 · 기간 고르기</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tripplanner/tokens.css">
<link rel="stylesheet" href="tp-icons.css">
</head>
<body>
<x-dc>
<helmet>
<style>*{font-family:var(--font-sans)}[data-theme]{font-weight:500}code{font-weight:500}
html,body{margin:0;overflow:hidden;scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div data-theme="light" style="position: relative; width: 390px; height: 860px; box-sizing: border-box; overflow: hidden; background: var(--background); color: var(--on_surface); font-family: var(--font-sans); display: flex; flex-direction: column;">
  <header style="display: flex; align-items: center; padding: 12px 8px 4px 4px;">
    <a href="NewTrip.dc.html" aria-label="닫기" style="width: 48px; height: 48px; border-radius: 24px; color: var(--on_surface); display: grid; place-items: center;"><span class="ic i-close" aria-hidden="true"></span></a>
    <h1 style="margin: 0; flex-grow: 1; font-size: 18px; line-height: 24px; font-weight: 600;">기간 고르기</h1>
  </header>
  <div style="padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--outline_variant);">
    <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text_sub);">시작일 – 종료일</span>
    <div style="display: flex; align-items: baseline; gap: 10px;"><b style="font-size: 24px; line-height: 32px; font-weight: 700; font-variant-numeric: tabular-nums;">2026.11.20 (금) – 11.23 (월)</b><span style="font-size: 14px; font-weight: 600; color: var(--text_sub);">3박 4일</span></div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 8px 12px 0; font-size: 12px; line-height: 32px; font-weight: 600; color: var(--text_sub); text-align: center;">
    <span style="color: var(--badge_red);">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
  </div>
  <div style="position: relative; flex-grow: 1; min-height: 0;">
  <div style="position: relative; padding: 0 8px 104px 12px; display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{months}}" as="m" hint-placeholder-count="2">
      <section style="flex: none; display: flex; flex-direction: column; gap: 4px;">
        <h2 style="margin: 12px 0 4px 8px; font-size: 16px; line-height: 24px; font-weight: 700;">{{m.label}}</h2>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px;">
          <sc-for list="{{m.cells}}" as="c" hint-placeholder-count="35">
            <span style="height: 44px; display: grid; place-items: center; background: {{c.band}}; border-radius: {{c.bandR}};">
              <span style="width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; font-size: 14px; font-variant-numeric: tabular-nums; font-weight: {{c.w}}; background: {{c.bg}}; color: {{c.fg}}; box-sizing: border-box; border: {{c.bd}};">{{c.t}}</span>
            </span>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 12px 16px 20px; background: var(--card_bg); border-top: 1px solid var(--outline_variant);">
    <a href="NewTrip.dc.html" style="flex-grow: 1; height: 48px; border-radius: 999px; border: 1px solid var(--outline); color: var(--primary); display: grid; place-items: center; font-size: 14px; font-weight: 600; text-decoration: none;">취소</a>
    <a href="NewTrip.dc.html" style="flex-grow: 2; height: 48px; border-radius: 999px; background: var(--primary); color: var(--on_primary); display: grid; place-items: center; font-size: 14px; font-weight: 600; text-decoration: none;">확인</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const month = (y, m, label) => {
    const first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate(), cells = [];
    for (let i = 0; i < first; i++) cells.push({ t: '', band: 'transparent', bandR: '0', bg: 'transparent', fg: 'inherit', w: 500, bd: '0' });
    for (let d = 1; d <= days; d++) {
      const inR = y === 2026 && m === 11 && d >= 20 && d <= 23, end = inR && (d === 20 || d === 23);
      const today = y === 2026 && m === 11 && d === 10;
      cells.push({ t: String(d),
        band: inR ? 'var(--primary_light)' : 'transparent',
        bandR: !inR ? '0' : d === 20 ? '22px 0 0 22px' : d === 23 ? '0 22px 22px 0' : '0',
        bg: end ? 'var(--primary)' : 'transparent',
        fg: end ? 'var(--on_primary)' : inR ? 'var(--on_primary_container)' : 'var(--on_surface)',
        w: end || today ? 700 : 500,
        bd: today ? '1px solid var(--primary)' : '0' });
    }
    return { label, cells };
  };
  return { months: [month(2026, 11, '2026년 11월'), month(2026, 12, '2026년 12월')] };
}
}
</script>
</body>
</html>
